name: Evolution Kernel - V4.4.1 KernelSU kallsyms path fix compile

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: whyred - KernelSU backslashxx base compile
    runs-on: ubuntu-22.04
    timeout-minutes: 100
    env:
      KERNEL_PIN: 9d9af460edf7a3889b05933f93c0ff137f56b3a4
      KSU_PIN: 9a02a5c1

    steps:
      - name: Checkout pinned whyred kernel
        uses: actions/checkout@v4
        with:
          repository: user-why-red/android_kernel_xiaomi_sdm660_419
          ref: 9d9af460edf7a3889b05933f93c0ff137f56b3a4
          fetch-depth: 1
          path: kernel

      - name: Verify pinned kernel
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$KERNEL_PIN"
          mkdir -p ../Evolution-V441-Report
          echo "$actual" | tee ../Evolution-V441-Report/kernel-commit.txt

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex make python3 python-is-python3 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            clang lld llvm libssl-dev libelf-dev \
            device-tree-compiler cpio rsync zip unzip git

      - name: Fetch pinned backslashxx KernelSU backup
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout \
            https://github.com/Najip/xxKSU.git KernelSU
          git -C KernelSU fetch --depth=1 origin final
          git -C KernelSU checkout --detach FETCH_HEAD
          actual="$(git -C KernelSU rev-parse HEAD)"
          case "$actual" in
            9a02a5c1*) ;;
            *) echo "Unexpected KernelSU commit: $actual"; exit 1 ;;
          esac

          test -s KernelSU/kernel/Kconfig
          test -s KernelSU/kernel/Makefile

          ln -s "$(realpath --relative-to=drivers KernelSU/kernel)" drivers/kernelsu
          printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
          printf '\nsource "drivers/kernelsu/Kconfig"\n' >> drivers/Kconfig

          echo "$actual" | tee ../Evolution-V441-Report/kernelsu-commit.txt
          echo "KernelSU source linked from Najip/xxKSU final (backslashxx preserved commit)."

      - name: Fix Linux 4.19 kallsyms iterator availability for builtin KernelSU
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' 2>&1 | tee ../Evolution-V441-Report/kallsyms-fix.log
          from pathlib import Path
          import re

          p = Path("kernel/kallsyms.c")
          s = p.read_text()

          # In this pinned 4.19 tree, kallsyms_on_each_symbol() is declared
          # unconditionally in include/linux/kallsyms.h but its definition is
          # incorrectly unavailable to builtin callers unless CONFIG_LIVEPATCH.
          # ARM64 does not select HAVE_LIVEPATCH in this tree, so KernelSU's
          # builtin reference becomes an undefined symbol at vmlinux link.
          start = "#ifdef CONFIG_LIVEPATCH\n/*\n * Iterate over all symbols in vmlinux."
          end = "#endif /* CONFIG_LIVEPATCH */"
          if s.count(start) != 1 or s.count(end) != 1:
              raise SystemExit("Expected exactly one guarded kallsyms iterator block; refusing unsafe edit")

          s = s.replace(start, "/*\n * Iterate over all symbols in vmlinux.", 1)
          s = s.replace(end, "", 1)
          p.write_text(s)

          h = Path("include/linux/kallsyms.h").read_text()
          if "int kallsyms_on_each_symbol(" not in h:
              raise SystemExit("Kernel header declaration missing; refusing build")

          block = s[s.index("int kallsyms_on_each_symbol("):]
          block = block[:block.index("\n}", 0) + 2]
          if "return 0;" not in block:
              raise SystemExit("Unexpected kallsyms iterator implementation; refusing build")
          print("Verified: kallsyms_on_each_symbol definition is now available to builtin callers.")
          PY
          grep -n -A18 -B3 'int kallsyms_on_each_symbol' kernel/kallsyms.c \
            | tee ../Evolution-V44-kernelsu-kallsyms-fix.txt
          ! grep -B1 -A1 -n 'int kallsyms_on_each_symbol' kernel/kallsyms.c | grep -q CONFIG_LIVEPATCH
          echo "KALLSYMS_FIX=PASS" | tee ../Evolution-V441-Report/kallsyms-fix-status.txt

      - name: Configure whyred kernel with builtin KernelSU
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          make O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CC=clang LD=ld.lld \
            vendor/whyred-perf_defconfig

          scripts/config --file out/.config \
            --enable KSU \
            --enable KALLSYMS \
            --enable KSU_HACK_ARM64_BRANCH_LINK \
            --disable KSU_TAMPER_SYSCALL_TABLE \
            --disable KSU_DEBUG \
            --set-str LOCALVERSION "-Evolution-KSU" \
            --disable LOCALVERSION_AUTO

          make O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CC=clang LD=ld.lld \
            olddefconfig

          grep -q '^CONFIG_KSU=y$' out/.config
          grep -q '^CONFIG_KALLSYMS=y$' out/.config
          grep -q '^CONFIG_KSU_HACK_ARM64_BRANCH_LINK=y$' out/.config
          cp out/.config ../Evolution-V441-Report/kernel.config

      - name: Audit KernelSU integration
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "===== KERNEL COMMIT ====="
            git rev-parse HEAD
            echo "===== KERNELSU COMMIT ====="
            git -C KernelSU rev-parse HEAD
            echo "===== KERNELSU VERSION ====="
            grep -n 'KSU_VERSION=' drivers/kernelsu/Makefile || true
            grep -n 'KSU_VERSION' drivers/kernelsu/Makefile | head -n 5 || true
            echo "===== KCONFIG ====="
            grep -E '^(CONFIG_(KSU|KALLSYMS|KSU_HACK_ARM64_BRANCH_LINK|KSU_TAMPER_SYSCALL_TABLE))|^# CONFIG_KSU' out/.config || true
            echo "===== LINK ====="
            readlink -f drivers/kernelsu
          } | tee ../Evolution-V441-Report/integration-audit.txt

      - name: Compile kernel and capture first compiler error
        working-directory: kernel
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p ../Evolution-V441-Report
          : > build.log
          set +e
          make -j2 O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CC=clang LD=ld.lld \
            Image.gz-dtb 2>&1 | tee build.log
          result=${PIPESTATUS[0]}
          set -e
          echo "MAKE_EXIT_CODE=$result" | tee ../Evolution-V441-Report/compile-status.txt
          if [ "$result" -eq 0 ] && [ -s out/arch/arm64/boot/Image.gz-dtb ]; then
            cp out/arch/arm64/boot/Image.gz-dtb ../Evolution-V441-Report/
            sha256sum out/arch/arm64/boot/Image.gz-dtb \
              > ../Evolution-V441-Report/Image.gz-dtb.sha256
            echo "IMAGE_GZ_DTB=PASS" >> ../Evolution-V441-Report/compile-status.txt
          else
            echo "IMAGE_GZ_DTB=NOT_GENERATED" >> ../Evolution-V441-Report/compile-status.txt
            exit 1
          fi

      - name: Collect diagnostics even after failure
        if: always()
        working-directory: kernel
        shell: bash
        run: |
          mkdir -p ../Evolution-V441-Report
          cp build.log ../Evolution-V441-Report/build.log 2>/dev/null || true
          cp ../Evolution-V44-kernelsu-kallsyms-fix.txt ../Evolution-V441-Report/ 2>/dev/null || true
          cp out/.config ../Evolution-V441-Report/kernel.config 2>/dev/null || true
          git rev-parse HEAD > ../Evolution-V441-Report/kernel-commit.txt 2>/dev/null || true
          git -C KernelSU rev-parse HEAD > ../Evolution-V441-Report/kernelsu-commit.txt 2>/dev/null || true
          if [ -s out/arch/arm64/boot/Image.gz-dtb ]; then
            cp out/arch/arm64/boot/Image.gz-dtb ../Evolution-V441-Report/
            sha256sum out/arch/arm64/boot/Image.gz-dtb \
              > ../Evolution-V441-Report/Image.gz-dtb.sha256
          fi

      - name: Upload V4.4 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Evolution-Kernel-V441-KernelSU-Kallsyms-Fix-Report
          path: Evolution-V441-Report/
          if-no-files-found: warn
          retention-days: 14
          
