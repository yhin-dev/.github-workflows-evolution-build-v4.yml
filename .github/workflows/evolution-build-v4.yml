name: Evolution Kernel - V4.5 SUSFS 4.19 Port Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: whyred - audit SUSFS 4.19 patch against pinned source
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      KERNEL_PIN: 9d9af460edf7a3889b05933f93c0ff137f56b3a4
      KSU_PIN: 9a02a5c1e552fb21cdb505c3c0428901eca43848
      SUSFS_PATCH_URL: https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/ec069a4e34f9/Patches/Patch/susfs_patch_to_4.19.patch

    steps:
      - name: Checkout pinned whyred kernel
        uses: actions/checkout@v4
        with:
          repository: user-why-red/android_kernel_xiaomi_sdm660_419
          ref: 9d9af460edf7a3889b05933f93c0ff137f56b3a4
          fetch-depth: 1
          path: kernel

      - name: Verify source and prepare report
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$KERNEL_PIN"
          mkdir -p ../Evolution-V45-SUSFS-Port-Audit
          echo "$KERNEL_PIN" > ../Evolution-V45-SUSFS-Port-Audit/kernel-commit.txt
          echo "$KSU_PIN" > ../Evolution-V45-SUSFS-Port-Audit/kernelsu-reference-commit.txt

      - name: Fetch pinned SUSFS 4.19 port
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          curl -fL "$SUSFS_PATCH_URL" -o ../Evolution-V45-SUSFS-Port-Audit/susfs_patch_to_4.19.patch
          sha256sum ../Evolution-V45-SUSFS-Port-Audit/susfs_patch_to_4.19.patch \
            | tee ../Evolution-V45-SUSFS-Port-Audit/susfs-patch.sha256
          {
            echo "PATCH_URL=$SUSFS_PATCH_URL"
            echo "PATCH_LINES=$(wc -l < ../Evolution-V45-SUSFS-Port-Audit/susfs_patch_to_4.19.patch)"
            echo "PATCH_BYTES=$(wc -c < ../Evolution-V45-SUSFS-Port-Audit/susfs_patch_to_4.19.patch)"
          } | tee ../Evolution-V45-SUSFS-Port-Audit/susfs-patch-info.txt

      - name: Apply non-destructive partial port audit
        working-directory: kernel
        shell: bash
        run: |
          set -uo pipefail
          REPORT="../Evolution-V45-SUSFS-Port-Audit"
          PATCH="$REPORT/susfs_patch_to_4.19.patch"

          # --reject applies only hunks whose context matches and writes every
          # rejected hunk to a .rej file. This checkout is disposable; no
          # partially patched source is committed or compiled.
          set +e
          git apply --reject --whitespace=nowarn --verbose "$PATCH" \
            > "$REPORT/git-apply-reject.log" 2>&1
          APPLY_RC=$?
          set -e
          echo "GIT_APPLY_REJECT_EXIT=$APPLY_RC" | tee "$REPORT/apply-status.txt"

          git diff --stat > "$REPORT/applied-diff-stat.txt" || true
          git diff --name-only > "$REPORT/applied-files.txt" || true

          find . -type f -name '*.rej' -print | sort > "$REPORT/rejected-files.txt"
          REJ_COUNT="$(wc -l < "$REPORT/rejected-files.txt" | tr -d ' ')"
          echo "REJECTED_FILE_COUNT=$REJ_COUNT" | tee -a "$REPORT/apply-status.txt"

          mkdir -p "$REPORT/rejects"
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            dest="$REPORT/rejects/$f"
            mkdir -p "$(dirname "$dest")"
            cp "$f" "$dest"
          done < "$REPORT/rejected-files.txt"

          # Capture exact target-side contexts for the files that previously
          # conflicted, without editing those files further.
          for f in fs/Makefile fs/namespace.c fs/proc/cmdline.c fs/proc/task_mmu.c fs/super.c kernel/sys.c mm/memory.c; do
            if [ -f "$f" ]; then
              mkdir -p "$REPORT/target-context/$(dirname "$f")"
              cp "$f" "$REPORT/target-context/$f"
            fi
          done

          {
            echo "===== PINNED KERNEL ====="
            git rev-parse HEAD
            echo "===== PATCHED FILES ====="
            cat "$REPORT/applied-files.txt"
            echo "===== REJECTED HUNKS ====="
            cat "$REPORT/rejected-files.txt"
            echo "===== SUSFS FILE PRESENCE ====="
            for f in fs/susfs.c include/linux/susfs.h include/linux/susfs_def.h; do
              if [ -s "$f" ]; then echo "PRESENT $f"; else echo "MISSING $f"; fi
            done
          } > "$REPORT/port-audit-summary.txt"

          # This workflow is an audit only; never proceed to compile a partial port.
          echo "AUDIT_ONLY=PASS" >> "$REPORT/apply-status.txt"

      - name: Upload SUSFS port audit even if earlier step fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Evolution-Kernel-V45-SUSFS-Port-Audit
          path: Evolution-V45-SUSFS-Port-Audit/
          if-no-files-found: warn
          retention-days: 14
